<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobPilot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">JobPilot <small>把投递变成可复盘的判断</small></div>
    <nav>
      <a href="/" class="{{ 'on' if request.url.path == '/' else '' }}">工作台</a>
      <a href="/inbox" class="{{ 'on' if request.url.path.startswith('/inbox') else '' }}">跟进</a>
      <a href="/review" class="{{ 'on' if request.url.path.startswith('/review') else '' }}">待确认</a>
      <a href="/jobs" class="{{ 'on' if request.url.path.startswith('/jobs') else '' }}">职位</a>
      <a href="/fetch" class="{{ 'on' if request.url.path.startswith('/fetch') else '' }}">抓取</a>
      <a href="/profile" class="{{ 'on' if request.url.path.startswith('/profile') else '' }}">档案</a>
      {% if demo_mode %}<span class="tag">DEMO</span>{% endif %}
    </nav>
  </div>
</header>
<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>
{% block scripts %}{% endblock %}
</body>
</html>
